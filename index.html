<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07110b">
<title>KURT SIDE</title>

<style>
:root{
  --bg:#050a07;
  --card:#0c1710;
  --card2:#101e15;
  --line:#21382a;
  --text:#eef8f1;
  --muted:#819487;
  --green:#37e87a;
  --yellow:#ffd54a;
  --orange:#ff9d42;
  --red:#ff5c5c;
  --blue:#59aaff;
}

*{box-sizing:border-box}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#10271a 0,#07110b 42%,#030604 100%);
  color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
}

button{font:inherit}

.wrap{
  width:min(1100px,100%);
  margin:auto;
  padding:12px;
}

header{
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px;
  background:rgba(10,22,14,.95);
}

.head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.logo{
  font-weight:950;
  font-size:21px;
  letter-spacing:.5px;
}

.logo span{color:var(--green)}

.time{
  color:var(--muted);
  font-size:12px;
}

.sub{
  margin-top:6px;
  font-size:11px;
  color:var(--muted);
}

.toolbar{
  display:flex;
  gap:7px;
  margin:10px 0;
  overflow:auto;
}

.toolbar button{
  flex:0 0 auto;
  min-height:42px;
  padding:0 13px;
  border-radius:11px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--text);
  font-weight:800;
}

.toolbar button.active{
  color:var(--green);
  border-color:#356b49;
}

.info{
  margin:8px 2px 11px;
  color:var(--muted);
  font-size:12px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:9px;
}

.match{
  border:1px solid var(--line);
  background:linear-gradient(145deg,#102018,#09120d);
  border-radius:16px;
  padding:13px;
  color:var(--text);
  text-align:left;
  cursor:pointer;
}

.matchTop{
  display:flex;
  justify-content:space-between;
  gap:8px;
  font-size:11px;
  color:var(--muted);
}

.teams{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:center;
  margin-top:9px;
}

.names{
  font-weight:850;
  line-height:1.55;
}

.score{
  font-size:22px;
  font-weight:950;
}

.odds{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
  margin-top:10px;
}

.odd{
  text-align:center;
  background:#08110c;
  border:1px solid var(--line);
  border-radius:10px;
  padding:7px;
}

.odd small{
  color:var(--muted);
  display:block;
  font-size:9px;
}

.odd strong{
  font-size:15px;
}

.pills{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  margin-top:8px;
}

.pill{
  padding:4px 7px;
  border-radius:999px;
  border:1px solid var(--line);
  font-size:9px;
  color:var(--muted);
}

.pill.ok{color:var(--green)}

.empty{
  padding:28px 10px;
  text-align:center;
  color:var(--muted);
  border:1px dashed var(--line);
  border-radius:15px;
}


/* PANEL */

.overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.76);
  overflow:auto;
  padding:10px;
}

.overlay.open{display:block}

.panel{
  width:min(720px,100%);
  margin:15px auto;
  background:#07100b;
  border:1px solid #294733;
  border-radius:19px;
  overflow:hidden;
}

.panelHead{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:14px;
  border-bottom:1px solid var(--line);
}

.panelTitle{
  font-weight:900;
}

.panelSub{
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}

.close{
  width:42px;
  height:42px;
  border:0;
  border-radius:10px;
  background:#15261a;
  color:white;
}

.body{
  padding:13px;
}

.hero{
  text-align:center;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  background:var(--card);
}

.heroLabel{
  font-size:11px;
  letter-spacing:1px;
  font-weight:900;
}

.heroMain{
  margin-top:4px;
  font-size:27px;
  font-weight:950;
}

.heroTeam{
  margin-top:3px;
  color:#c9dbcf;
}

.green{color:var(--green)}
.yellow{color:var(--yellow)}
.orange{color:var(--orange)}
.red{color:var(--red)}
.blue{color:var(--blue)}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:9px;
}

.metric{
  border:1px solid var(--line);
  background:var(--card2);
  border-radius:12px;
  padding:9px;
}

.metric small{
  color:var(--muted);
  font-size:9px;
  display:block;
}

.metric strong{
  display:block;
  margin-top:4px;
  font-size:17px;
}

.section{
  margin-top:10px;
  background:#0b1710;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
}

.sectionTitle{
  color:#b9cbbf;
  font-size:11px;
  font-weight:900;
  margin-bottom:8px;
}

.probs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}

.prob{
  text-align:center;
  background:#07100b;
  border:1px solid var(--line);
  border-radius:11px;
  padding:9px 5px;
}

.prob small{
  display:block;
  color:var(--muted);
  font-size:9px;
}

.prob strong{
  font-size:19px;
}

.path{
  line-height:1.8;
  font-size:11px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  word-break:break-word;
}

.scoreRows{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.scoreRow{
  display:flex;
  justify-content:space-between;
  background:#07100b;
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px;
  font-size:12px;
}

.reason{
  font-size:11px;
  line-height:1.5;
  padding:5px 0;
  border-bottom:1px solid #19281e;
}

.reason:last-child{border-bottom:0}

.note{
  margin-top:10px;
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}

.loading{
  padding:35px;
  text-align:center;
  color:var(--green);
  font-weight:900;
}

@media(max-width:480px){
  .wrap{padding:8px}
  .grid{grid-template-columns:1fr}
  .metrics{grid-template-columns:repeat(2,1fr)}
  .logo{font-size:18px}
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <div class="head">
    <div class="logo">🐺 KURT <span>SIDE</span></div>
    <div class="time" id="clock">--:--</div>
  </div>

  <div class="sub">
    Goaloo • Bet365 • GitHub oran arşivi • Piyasa + trend simülasyonu
  </div>
</header>

<div class="toolbar">
  <button class="active" data-filter="all">Tümü</button>
  <button data-filter="bet365">Bet365</button>
  <button data-filter="live">Canlı</button>
  <button id="refreshBtn">↻ Yenile</button>
</div>

<div class="info" id="info">Veri yükleniyor...</div>

<div class="grid" id="matches"></div>

</div>


<div class="overlay" id="overlay">

  <div class="panel">

    <div class="panelHead">
      <div>
        <div class="panelTitle" id="panelTitle">Maç</div>
        <div class="panelSub" id="panelSub"></div>
      </div>

      <button class="close" id="closeBtn">✕</button>
    </div>

    <div class="body" id="panelBody">
      <div class="loading">Analiz hazırlanıyor...</div>
    </div>

  </div>

</div>


<script>
const LATEST_URL = "./data/latest.json";
const ARCHIVE_URL = "./data/archive.jsonl";

let currentMatches = [];
let archiveCache = null;
let filter = "all";

const matchesEl = document.getElementById("matches");
const infoEl = document.getElementById("info");
const overlay = document.getElementById("overlay");
const panelBody = document.getElementById("panelBody");

document.getElementById("refreshBtn").onclick = loadLatest;
document.getElementById("closeBtn").onclick = () => overlay.classList.remove("open");

overlay.addEventListener("click",e=>{
  if(e.target===overlay) overlay.classList.remove("open");
});

document.querySelectorAll("[data-filter]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("[data-filter]").forEach(x=>x.classList.remove("active"));
    btn.classList.add("active");
    filter=btn.dataset.filter;
    render();
  });
});

setInterval(()=>{
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("tr-TR",{
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    });
},1000);

loadLatest();
setInterval(loadLatest,60000);


/* ==========================
   LOAD
========================== */

async function loadLatest(){

  try{

    infoEl.textContent="Goaloo / Bet365 verisi okunuyor...";

    const res=await fetch(
      LATEST_URL+"?t="+Date.now(),
      {cache:"no-store"}
    );

    if(!res.ok) throw new Error("HTTP "+res.status);

    const data=await res.json();

    currentMatches=Array.isArray(data.matches)
      ? data.matches
      : [];

    archiveCache=null;

    render();

    infoEl.textContent =
      `${currentMatches.length} maç • Son kayıt: ${
        fmtTime(data.capturedAt)
      }`;

  }catch(err){

    console.error(err);

    infoEl.textContent="Veri okunamadı: "+err.message;

    matchesEl.innerHTML=
      `<div class="empty">
        latest.json okunamadı.
      </div>`;
  }
}


/* ==========================
   CARDS
========================== */

function render(){

  let list=[...currentMatches];

  if(filter==="bet365"){
    list=list.filter(m=>get1X2(m));
  }

  if(filter==="live"){
    list=list.filter(m=>isLive(m));
  }

  matchesEl.innerHTML="";

  if(!list.length){
    matchesEl.innerHTML=
      `<div class="empty">Bu filtrede maç yok.</div>`;
    return;
  }

  for(const m of list){

    const one=get1X2(m);

    const card=document.createElement("button");
    card.className="match";

    card.innerHTML=`
      <div class="matchTop">
        <span>${escapeHtml(
          m.leagueName ||
          (m.leagueIndex!=null ? "Lig #"+m.leagueIndex : "Goaloo")
        )}</span>

        <span>${isLive(m) ? "CANLI" : fmtStart(m.start)}</span>
      </div>

      <div class="teams">
        <div class="names">
          <div>${escapeHtml(m.home||"-")}</div>
          <div>${escapeHtml(m.away||"-")}</div>
        </div>

        <div class="score">
          ${scoreText(m)}
        </div>
      </div>

      ${
        one
        ? `
          <div class="odds">
            <div class="odd"><small>1</small><strong>${f2(one.home)}</strong></div>
            <div class="odd"><small>X</small><strong>${f2(one.draw)}</strong></div>
            <div class="odd"><small>2</small><strong>${f2(one.away)}</strong></div>
          </div>
        `
        : ""
      }

      <div class="pills">
        <span class="pill ${one?"ok":""}">
          ${one ? "Bet365 ✓" : "Bet365 yok"}
        </span>

        ${
          m.bet365?.overUnder
          ? `<span class="pill">Ü/A ${escapeHtml(m.bet365.overUnder.line??"-")}</span>`
          : ""
        }

        ${
          m.goalooId
          ? `<span class="pill">ID ${escapeHtml(m.goalooId)}</span>`
          : ""
        }
      </div>
    `;

    card.onclick=()=>openMatch(m);

    matchesEl.appendChild(card);
  }
}


/* ==========================
   MATCH ANALYSIS
========================== */

async function openMatch(match){

  overlay.classList.add("open");

  document.getElementById("panelTitle").textContent =
    `${match.home} - ${match.away}`;

  document.getElementById("panelSub").textContent =
    `${scoreText(match)} • ${isLive(match) ? "Canlı" : "Maç önü"}`;

  panelBody.innerHTML=
    `<div class="loading">🐺 Oran izi ve simülasyon hazırlanıyor...</div>`;

  try{

    const archive=await loadArchive();

    const rows=buildHistory(match,archive);

    const result=analyze(match,rows);

    drawAnalysis(match,result);

  }catch(err){

    console.error(err);

    panelBody.innerHTML=
      `<div class="section">
        Arşiv okunamadı: ${escapeHtml(err.message)}
      </div>`;
  }
}


/* ==========================
   ARCHIVE
========================== */

async function loadArchive(){

  if(archiveCache) return archiveCache;

  const res=await fetch(
    ARCHIVE_URL+"?t="+Date.now(),
    {cache:"no-store"}
  );

  if(!res.ok) throw new Error("archive HTTP "+res.status);

  const text=await res.text();

  archiveCache=text
    .split(/\r?\n/)
    .map(x=>x.trim())
    .filter(Boolean)
    .map(line=>{
      try{return JSON.parse(line)}
      catch{return null}
    })
    .filter(Boolean);

  return archiveCache;
}


function buildHistory(match,archive){

  const rows=[];

  for(const snap of archive){

    const list=Array.isArray(snap.matches)
      ? snap.matches
      : [];

    const found=list.find(x=>sameMatch(match,x));

    if(!found) continue;

    const odds=get1X2(found);

    if(!odds) continue;

    const prob=noVig(odds);

    if(!prob) continue;

    rows.push({
      time:new Date(snap.capturedAt||0).getTime(),
      capturedAt:snap.capturedAt,
      odds,
      prob,
      score:found.score||null,
      overUnder:found.bet365?.overUnder||null
    });
  }

  rows.sort((a,b)=>a.time-b.time);

  return dedupe(rows);
}


/* ==========================
   ANALYSIS
========================== */

function analyze(match,rows){

  const current=get1X2(match);

  if(!current){

    return{
      level:"VERİ YOK",
      className:"red",
      sideLabel:"BEKLE",
      score:0,
      reasons:["Bet365 1X2 verisi bulunamadı."],
      samples:rows
    };
  }

  let samples=[...rows];

  const currentProb=noVig(current);

  samples.push({
    time:Date.now(),
    capturedAt:new Date().toISOString(),
    odds:current,
    prob:currentProb,
    score:match.score||null,
    overUnder:match.bet365?.overUnder||null
  });

  samples=dedupe(samples);

  const latest=samples[samples.length-1];

  const row5=before(samples,latest.time-5*60000)||samples[0];
  const row10=before(samples,latest.time-10*60000)||samples[0];

  const h5=(latest.prob.home-row5.prob.home)*100;
  const a5=(latest.prob.away-row5.prob.away)*100;

  const h10=(latest.prob.home-row10.prob.home)*100;
  const a10=(latest.prob.away-row10.prob.away)*100;

  let side =
    h10>=a10
      ? "HOME"
      : "AWAY";

  let sideLabel =
    side==="HOME"
      ? "MS 1"
      : "MS 2";

  let sideName =
    side==="HOME"
      ? match.home
      : match.away;

  const move5 =
    side==="HOME"
      ? h5
      : a5;

  const move10 =
    side==="HOME"
      ? h10
      : a10;

  const stability=trendStability(samples,side);

  let score=0;

  score+=clamp(move10*6,0,35);
  score+=clamp(move5*7,0,25);
  score+=stability*20;
  score+=Math.min(samples.length,10);

  score=Math.round(clamp(score,0,100));

  let level="İZLE";
  let className="blue";

  if(score>=78 && move10>=2){
    level="GÜÇLÜ EĞİLİM";
    className="green";
  }else if(score>=62 && move10>=1){
    level="EĞİLİM";
    className="yellow";
  }else if(move10<0.4){
    sideLabel="BEKLE";
    sideName="Belirgin taraf hareketi yok";
    className="orange";
  }

  /*
    Trend etkisini küçük oranda
    piyasa ihtimallerine ekle.
    Bu bir TEST simülasyonudur.
  */

  let pHome=latest.prob.home;
  let pDraw=latest.prob.draw;
  let pAway=latest.prob.away;

  if(samples.length>=3){

    pHome += clamp(h10/100*.45,-.04,.04);
    pAway += clamp(a10/100*.45,-.04,.04);

    pDraw = Math.max(
      .05,
      1-pHome-pAway
    );

    const sum=pHome+pDraw+pAway;

    pHome/=sum;
    pDraw/=sum;
    pAway/=sum;
  }


  /*
    Poisson simülasyonu:
    1X2 hedefi + varsa Goaloo/Bet365
    Over/Under fiyatı ile en uygun
    gol ortalamalarını bulur.
  */

  const ou=latest.overUnder || match.bet365?.overUnder || null;

  const fit=fitPoisson(
    {home:pHome,draw:pDraw,away:pAway},
    ou
  );


  const sim=poissonSummary(
    fit.lambdaHome,
    fit.lambdaAway
  );


  const reasons=[];

  reasons.push(
    `${samples.length} Bet365 snapshot kullanıldı.`
  );

  if(move10>0){
    reasons.push(
      `${side==="HOME"?"Ev":"Deplasman"} tarafı 10 dk içinde +${move10.toFixed(2)} puan güçlendi.`
    );
  }

  if(move5>.4){
    reasons.push(
      `Son 5 dk hareketi +${move5.toFixed(2)} puan.`
    );
  }

  reasons.push(
    `Oran yönü tutarlılığı %${Math.round(stability*100)}.`
  );

  if(ou){
    reasons.push(
      `Üst/Alt piyasası simülasyona dahil edildi: çizgi ${ou.line??"-"}.`
    );
  }

  return{
    level,
    className,
    side,
    sideLabel,
    sideName,
    score,
    current,
    market:{
      home:pHome*100,
      draw:pDraw*100,
      away:pAway*100
    },
    move5,
    move10,
    stability,
    samples,
    sim,
    reasons
  };
}


/* ==========================
   POISSON
========================== */

function fitPoisson(target,ou){

  let targetOver=null;
  let targetLine=null;

  if(ou && validOdd(ou.over) && validOdd(ou.under)){

    const o=1/Number(ou.over);
    const u=1/Number(ou.under);

    targetOver=o/(o+u);

    const line=parseFloat(ou.line);

    if(Number.isFinite(line)){
      targetLine=line;
    }
  }

  let best={
    err:Infinity,
    lambdaHome:1.2,
    lambdaAway:1.0
  };

  for(let lh=.15;lh<=4.5;lh+=.08){

    for(let la=.15;la<=4.5;la+=.08){

      const s=poissonSummary(lh,la);

      let err=
        sq(s.home-target.home)+
        sq(s.draw-target.draw)+
        sq(s.away-target.away);

      if(
        targetOver!=null &&
        targetLine!=null
      ){

        const overProb=
          poissonOverLine(
            lh+la,
            targetLine
          );

        err+=
          .65*
          sq(overProb-targetOver);
      }

      if(err<best.err){
        best={
          err,
          lambdaHome:lh,
          lambdaAway:la
        };
      }
    }
  }

  return best;
}


function poissonSummary(lh,la){

  let home=0;
  let draw=0;
  let away=0;
  let btts=0;
  let over25=0;

  const scores=[];

  for(let h=0;h<=7;h++){

    for(let a=0;a<=7;a++){

      const p=
        poisson(h,lh)*
        poisson(a,la);

      if(h>a) home+=p;
      else if(h===a) draw+=p;
      else away+=p;

      if(h>0 && a>0) btts+=p;

      if(h+a>=3) over25+=p;

      scores.push({
        score:`${h}-${a}`,
        p
      });
    }
  }

  const total=home+draw+away;

  home/=total;
  draw/=total;
  away/=total;

  scores.sort((x,y)=>y.p-x.p);

  const scoreSum=scores.reduce((s,x)=>s+x.p,0);

  return{
    home,
    draw,
    away,
    btts:btts/scoreSum,
    over25:over25/scoreSum,
    topScores:scores
      .slice(0,5)
      .map(x=>({
        score:x.score,
        p:x.p/scoreSum
      }))
  };
}


function poissonOverLine(lambda,line){

  const threshold=Math.floor(line)+1;

  let under=0;

  for(let g=0;g<threshold;g++){
    under+=poisson(g,lambda);
  }

  return clamp(1-under,0,1);
}


function poisson(k,lambda){

  return(
    Math.exp(-lambda)*
    Math.pow(lambda,k)/
    factorial(k)
  );
}

function factorial(n){

  let r=1;

  for(let i=2;i<=n;i++){
    r*=i;
  }

  return r;
}


/* ==========================
   PANEL
========================== */

function drawAnalysis(match,r){

  if(!r.current){

    panelBody.innerHTML=`
      <div class="hero">
        <div class="heroLabel red">${r.level}</div>
        <div class="heroMain red">BEKLE</div>
      </div>
    `;

    return;
  }

  const path=r.samples
    .slice(-10)
    .map(x=>{
      const odd=
        r.side==="AWAY"
          ? x.odds.away
          : x.odds.home;

      return `${fmtTime(x.capturedAt)} → ${f2(odd)}`;
    })
    .join(" • ");


  panelBody.innerHTML=`

    <div class="hero">

      <div class="heroLabel ${r.className}">
        ${r.level}
      </div>

      <div class="heroMain ${r.className}">
        ${r.sideLabel}

/* ==========================
   HELPERS
========================== */

function get1X2(m){

  const o=m?.bet365?.oneXTwo;

  if(
    o &&
    validOdd(o.home) &&
    validOdd(o.draw) &&
    validOdd(o.away)
  ){
    return{
      home:Number(o.home),
      draw:Number(o.draw),
      away:Number(o.away)
    };
  }

  return null;
}


function noVig(o){

  if(!o) return null;

  const h=1/o.home;
  const d=1/o.draw;
  const a=1/o.away;

  const s=h+d+a;

  return{
    home:h/s,
    draw:d/s,
    away:a/s
  };
}


function trendStability(rows,side){

  if(rows.length<2) return 0;

  let good=0;
  let total=0;

  for(let i=1;i<rows.length;i++){

    const p0=
      side==="HOME"
      ? rows[i-1].prob.home
      : rows[i-1].prob.away;

    const p1=
      side==="HOME"
      ? rows[i].prob.home
      : rows[i].prob.away;

    total++;

    if(p1>=p0-.002){
      good++;
    }
  }

  return total ? good/total : 0;
}


function before(rows,target){

  let found=null;

  for(const r of rows){

    if(r.time<=target){
      found=r;
    }else{
      break;
    }
  }

  return found;
}


function dedupe(rows){

  const out=[];

  for(const r of rows){

    const last=out[out.length-1];

    if(
      last &&
      Math.abs(last.time-r.time)<15000 &&
      last.odds.home===r.odds.home &&
      last.odds.draw===r.odds.draw &&
      last.odds.away===r.odds.away
    ){
      continue;
    }

    out.push(r);
  }

  return out;
}


function sameMatch(a,b){

  if(
    a.goalooId!=null &&
    b.goalooId!=null
  ){
    return String(a.goalooId)===String(b.goalooId);
  }

  return(
    norm(a.home)===norm(b.home) &&
    norm(a.away)===norm(b.away)
  );
}


function norm(x){

  return String(x||"")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9]/g,"");
}


function isLive(m){

  const s=Number(m.status);

  return(
    Number.isFinite(s) &&
    s>0
  );
}


function scoreText(m){

  const h=m?.score?.home;
  const a=m?.score?.away;

  if(
    h==null ||
    a==null
  ){
    return "-";
  }

  return `${h}-${a}`;
}


function fmtStart(x){

  if(!x) return "Maç önü";

  const d=new Date(x);

  if(!Number.isFinite(d.getTime())){
    return String(x);
  }

  return d.toLocaleTimeString(
    "tr-TR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function fmtTime(x){

  if(!x) return "-";

  const d=new Date(x);

  if(!Number.isFinite(d.getTime())){
    return "-";
  }

  return d.toLocaleTimeString(
    "tr-TR",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );
}


function validOdd(x){

  const n=Number(x);

  return(
    Number.isFinite(n) &&
    n>1 &&
    n<100
  );
}


function f2(x){

  return validOdd(x)
    ? Number(x).toFixed(2)
    : "-";
}


function pct(x){

  if(!Number.isFinite(Number(x))){
    return "-";
  }

  return `%${Math.round(Number(x)*100)}`;
}


function signed(x){

  if(!Number.isFinite(Number(x))){
    return "-";
  }

  const n=Number(x);

  return(
    n>=0 ? "+" : ""
  ) + n.toFixed(2);
}


function clamp(x,min,max){
  return Math.min(max,Math.max(min,Number(x)));
}

function sq(x){
  return x*x;
}

function escapeHtml(x){

  return String(x??"")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}
